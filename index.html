<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BYTKOJN – český web o Bitcoinu a penězích se připravuje.">
  <meta name="theme-color" content="#08090b">

  <!-- Dočasně nechceme, aby rozpracovanou stránku indexovaly vyhledávače. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Ponechává původní umístění favicony v projektu. -->
  <link rel="icon" href="assets/media/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="assets/css/coming-soon.css">

  <title>BYTKOJN | Web se připravuje</title>
</head>
<body>
  <!-- Jemná technická mřížka převzatá z vizuálního stylu projektu. -->
  <div class="background-grid" aria-hidden="true"></div>

  <main class="coming-soon-shell">
    <section class="coming-soon-panel" aria-labelledby="pageTitle">

      <!-- Horní terminálová lišta zůstává jako jediný navigační motiv. -->
      <div class="terminal-bar">
        <div class="terminal-path">~/bytkojn/home/overview</div>

        <div class="terminal-meta" aria-label="Terminálový motiv">
          <span class="term-cmd">grep</span>
          <span class="term-flag">-R</span>
          <span class="term-query">"truth"</span>
          <span class="term-search-path">/out/there</span>
        </div>
      </div>

      <div class="coming-soon-content">
        <div class="hero-copy">
          <p class="hero-kicker">OTEVŘENĚ O BITCOINU A PENĚZÍCH</p>

          <h1 id="pageTitle" aria-label="Bitcoin bez technického strašení">
            <span class="hero-title-fixed">Bitcoin bez</span>

            <span class="rotating-line">
              <span
                id="rotatingWord"
                class="rotating-word"
                aria-hidden="true"
              >technického strašení</span>
            </span>
          </h1>
        </div>

        <!-- Dekorativní indikátor rozpracovaného webu. Jednotlivá kladívka vloží JavaScript. -->
        <div class="construction-status" aria-label="Web se připravuje">
          <div
            class="hammer-spinner"
            id="hammerSpinner"
            aria-hidden="true"
          ></div>

          <p class="construction-title">WEB SE PŘIPRAVUJE</p>
          <p class="construction-subtitle">deploying &lt;bytkojn/&gt;</p>
        </div>
      </div>

    </section>
  </main>

  <noscript>
    <div class="noscript-message">
      Stránka je dostupná, ale pro dynamický nadpis je potřeba povolit JavaScript.
    </div>
  </noscript>

  <script src="assets/js/coming-soon.js"></script>
</body>
</html>
