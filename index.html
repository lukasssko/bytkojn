<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="BYTKOJN – český web o Bitcoinu a penězích se připravuje."
  >
  <meta name="theme-color" content="#08090b">
  <meta name="robots" content="noindex, nofollow">

  <link
    rel="icon"
    href="assets/media/favicon.svg"
    type="image/svg+xml"
  >

  <!--
    Parametr ?v=4 vynutí načtení nové verze CSS,
    místo staré kopie uložené v mezipaměti prohlížeče.
  -->
  <link rel="stylesheet" href="assets/css/styles.css?v=4">

  <title>BYTKOJN | Web se připravuje</title>
</head>

<body>
  <div class="background-grid" aria-hidden="true"></div>

  <main class="coming-soon-shell">
    <section class="coming-soon-panel" aria-labelledby="pageTitle">

      <div class="terminal-bar">
        <div class="terminal-path">
          ~/bytkojn/home/overview
        </div>

        <div class="terminal-meta" aria-label="Terminálový motiv">
          <span class="term-cmd">grep</span>
          <span class="term-flag">-R</span>
          <span class="term-query">"truth"</span>
          <span class="term-search-path">/out/there</span>
        </div>
      </div>

      <div class="coming-soon-content">
        <div class="coming-soon-stage">

          <div class="hero-copy">
            <p class="hero-kicker">
              OTEVŘENĚ O BITCOINU A PENĚZÍCH
            </p>

            <h1
              id="pageTitle"
              aria-label="Bitcoin bez technického strašení"
            >
              <span class="hero-title-fixed">
                Bitcoin bez
              </span>

              <span class="rotating-line">
                <span
                  id="rotatingWord"
                  class="rotating-word"
                  aria-hidden="true"
                >technického strašení</span>
              </span>
            </h1>
          </div>

          <div
            class="construction-status"
            aria-label="Web se připravuje"
          >
            <div class="build-scene" aria-hidden="true">

              <div class="hammer-assembly">
                <div class="hammer">
                  <span class="hammer-head"></span>
                  <span class="hammer-handle"></span>
                </div>
              </div>

              <div class="bitcoin-block">
                <div class="block-top-line">
                  BLOCK #839201
                </div>

                <div class="block-center">
                  ₿
                </div>

                <div class="block-bottom-line">
                  00000000000000000004f2a
                </div>
              </div>

              <span class="impact-mark impact-mark-left"></span>
              <span class="impact-mark impact-mark-center"></span>
              <span class="impact-mark impact-mark-right"></span>
            </div>

            <p class="construction-title">
              WEB SE PŘIPRAVUJE
            </p>

            <p class="construction-subtitle">
              deploying &lt;bytkojn/&gt;
            </p>
          </div>

        </div>
      </div>

    </section>
  </main>

  <noscript>
    <div class="noscript-message">
      Stránka je dostupná, ale pro dynamický nadpis je potřeba povolit JavaScript.
    </div>
  </noscript>

  <!-- Stejný princip jako u CSS: ?v=4 obejde starou verzi v cache. -->
  <script src="assets/js/app.js?v=4"></script>
</body>
</html>
